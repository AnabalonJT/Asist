# fly.toml app configuration file generated for habittrack-bot on 2026-07-02T23:03:32-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'habittrack-bot'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEBUG = 'false'
  OPENROUTER_BASE_URL = 'https://openrouter.ai/api/v1'
  OPENROUTER_MODEL = 'nvidia/nemotron-3-ultra-550b-a55b:free'
  TELEGRAM_BOT_USERNAME = 'HabiFolloBot'
  TELEGRAM_WEBHOOK_URL = 'https://habittrack-bot.fly.dev/api/telegram/webhook'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '60s'
    timeout = '10s'
    grace_period = '100s'
    method = 'GET'
    path = '/health'
    

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
